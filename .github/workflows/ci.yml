name: CI Quality & Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          AUTO_SEED_FULL: "false"
        run: |
          python -m pytest tests/test_validation_engine.py tests/test_engine_reupload.py tests/test_anomaly.py -v

  frontend-check:
    name: Frontend TypeCheck & Verification (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: TypeScript TypeCheck
        working-directory: frontend
        run: |
          npx tsc --noEmit
